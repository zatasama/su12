<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thi xong rồi... học gì nữa?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,#0e1220 60%,#05070d 100%);
    color:#e9ecf6; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,255,255,.6), transparent);
  }
  .container{
    position:relative; z-index:1; width:100%; max-width:520px;
    padding:24px 0 40px; display:flex; flex-direction:column; align-items:center;
  }
  h1{
    text-align:center; font-size:clamp(1.4rem,5vw,1.9rem);
    font-weight:900; margin:8px 0 6px; line-height:1.2;
    background:linear-gradient(120deg,#fde68a,#fbbf24,#f59e0b,#fbbf24,#fde68a);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:shimmer 4s linear infinite;
  }
  @keyframes shimmer{to{background-position:200% center}}
  .subtitle{
    text-align:center; color:#98a1b9; font-size:.92rem; margin:0 0 20px;
  }
  .wheel-wrap{
    position:relative; width:min(360px,calc(100vw - 48px)); aspect-ratio:1;
    margin:12px 0 24px;
  }
  .pointer{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:30px solid #fbbf24;
    filter:drop-shadow(0 4px 8px rgba(251,191,36,.5));
    z-index:10; animation:pointer-bounce .8s ease-in-out infinite;
  }
  @keyframes pointer-bounce{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(3px)}
  }
  #wheel{
    width:100%; height:100%; border-radius:50%;
    box-shadow:
      0 0 0 6px rgba(255,255,255,.08),
      0 0 0 10px rgba(255,255,255,.04),
      0 30px 60px rgba(0,0,0,.6),
      0 0 100px rgba(251,191,36,.15);
    will-change:transform;
  }
  .spin-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#334155,#1e293b 60%,#0f172a);
    border:4px solid #fbbf24; color:#fbbf24;
    font-family:inherit; font-weight:900; font-size:1rem; letter-spacing:1px;
    cursor:pointer; z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.1);
    transition:transform .15s, box-shadow .15s;
  }
  .spin-btn:hover:not(:disabled){
    transform:translate(-50%,-50%) scale(1.08);
    box-shadow:0 8px 30px rgba(251,191,36,.5), inset 0 2px 0 rgba(255,255,255,.2);
  }
  .spin-btn:active:not(:disabled){transform:translate(-50%,-50%) scale(.95)}
  .spin-btn:disabled{cursor:not-allowed; opacity:.7}

  .result{
    text-align:center; padding:18px 24px; border-radius:20px;
    background:rgba(30,41,59,.6); border:1px solid rgba(251,191,36,.3);
    backdrop-filter:blur(12px); max-width:440px;
    opacity:0; transform:translateY(20px);
    transition:opacity .5s, transform .5s; margin-bottom:16px;
  }
  .result.show{opacity:1; transform:translateY(0)}
  .result .emoji{
    font-size:2.6rem; display:block; margin-bottom:8px;
    animation:pop-in .6s cubic-bezier(.16,1.3,.3,1);
  }
  @keyframes pop-in{
    0%{transform:scale(0) rotate(-45deg)}
    100%{transform:scale(1) rotate(0)}
  }
  .result .title{font-size:1.2rem; font-weight:800; color:#fbbf24; margin:0 0 8px}
  .result .msg{color:#cbd5e1; font-size:.95rem; margin:0; line-height:1.5}

  .history{width:100%; max-width:440px; margin-top:8px}
  .history h3{
    color:#98a1b9; font-size:.85rem; text-transform:uppercase;
    letter-spacing:1px; margin:0 0 10px; text-align:center;
  }
  .history-list{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
  .chip{
    padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1); font-size:.82rem; color:#cbd5e1;
  }

  .confetti{
    position:fixed; top:-30px; font-size:22px; pointer-events:none; z-index:100;
    animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important}
  }
</style>
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <h1>Thi xong rồi<br>học gì nữa?</h1>
    <p class="subtitle">Quay vòng quay định mệnh, xem vũ trụ bảo gì 👇</p>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="720" height="720"></canvas>
      <button class="spin-btn" id="spinBtn">QUAY</button>
    </div>

    <div class="result" id="result">
      <span class="emoji" id="rEmoji">🎯</span>
      <p class="title" id="rTitle">Kết quả</p>
      <p class="msg" id="rMsg"></p>
    </div>

    <div class="history" id="history" style="display:none">
      <h3>Lịch sử quay</h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

<script>
  const SEGMENTS = [
    {emoji:'😴',label:'Ngủ', color:'#ef4444',title:'Ngủ một giấc cho đã!',msg:'Thi xong rồi, ngủ bù thôi. Mai tính tiếp 😴'},
    {emoji:'🎬',label:'Phim',color:'#f59e0b',title:'Cày phim thôi!',msg:'Làm cả series phim đi, không ai cấm đâu 🍿'},
    {emoji:'🍜',label:'Ăn',  color:'#eab308',title:'Ăn uống thả ga!',msg:'Gọi món yêu thích, ăn cho quên sầu 🍜'},
    {emoji:'🎮',label:'Game',color:'#22c55e',title:'Chơi game đến sáng!',msg:'Rank đi, nhưng nhớ nghỉ mắt nha 🎮'},
    {emoji:'🏖️',label:'Nghỉ',color:'#06b6d4',title:'Đi chơi đi!',msg:'Rủ bạn bè đi cà phê, xem phim, dạo phố 🏖️'},
    {emoji:'📚',label:'Học', color:'#3b82f6',title:'Học tiếp?! Dở hơi!',msg:'Thi xong rồi mà còn học. Nhưng bạn giỏi thì cứ học 😅'},
    {emoji:'📱',label:'Lướt',color:'#8b5cf6',title:'Lướt điện thoại cả ngày!',msg:'TikTok, Facebook, Instagram... hết ngày luôn 📱'},
    {emoji:'🎵',label:'Nhạc',color:'#ec4899',title:'Nghe nhạc chill!',msg:'Tai nghe vào, nhạc lên, quên hết bài thi 🎵'},
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');
  const historyList = document.getElementById('historyList');

  const SIZE = canvas.width;
  const CX = SIZE/2, CY = SIZE/2, RADIUS = SIZE/2 - 8;
  const N = SEGMENTS.length;
  const SEG_ANGLE = (Math.PI*2)/N;

  let currentRotation = 0;
  let spinning = false;
  let history = [];

  function drawWheel(){
    ctx.clearRect(0,0,SIZE,SIZE);
    SEGMENTS.forEach((seg,i)=>{
      const start = -Math.PI/2 + i*SEG_ANGLE;
      const end = start + SEG_ANGLE;

      ctx.beginPath();
      ctx.moveTo(CX,CY);
      ctx.arc(CX,CY,RADIUS,start,end);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 3;
      ctx.stroke();

      const mid = start + SEG_ANGLE/2;
      const tx = CX + Math.cos(mid)*(RADIUS*0.68);
      const ty = CY + Math.sin(mid)*(RADIUS*0.68);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '64px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.fillText(seg.emoji, tx, ty - 18);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 34px "Be Vietnam Pro",sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 6;
      ctx.fillText(seg.label, tx, ty + 38);
      ctx.restore();
    });

    // Chấm trắng ở ranh giới các ô
    SEGMENTS.forEach((_,i)=>{
      const a = -Math.PI/2 + i*SEG_ANGLE;
      const dx = CX + Math.cos(a)*(RADIUS-6);
      const dy = CY + Math.sin(a)*(RADIUS-6);
      ctx.beginPath();
      ctx.arc(dx,dy,5,0,Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    });

    ctx.beginPath();
    ctx.arc(CX,CY,RADIUS,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(251,191,36,.6)';
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  let audioCtx = null;
  function initAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
  }
  function playTick(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = 1200 + Math.random()*400;
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
    osc.start(); osc.stop(audioCtx.currentTime + 0.03);
  }
  function playFanfare(){
    if(!audioCtx) return;
    [523,659,784,1047,1319].forEach((freq,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = audioCtx.currentTime + i*0.09;
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    });
  }

  function confetti(count = 50){
    const emojis = ['🎉','⭐','✨','🎊','🌟','🎈','🎯'];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.animationDuration = (2+Math.random()*2.5)+'s';
      el.style.animationDelay = (Math.random()*0.3)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 5500);
    }
  }

  const easeOutCubic = t => 1 - Math.pow(1-t,3);

  function spin(){
    if(spinning) return;
    spinning = true;
    initAudio();
    spinBtn.disabled = true;
    resultEl.classList.remove('show');

    const winnerIdx = Math.floor(Math.random()*N);
    const segCenter = winnerIdx*(360/N) + (360/N)/2;
    const targetMod = (360 - segCenter + 360) % 360;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = targetMod - currentMod;
    if(delta < 0) delta += 360;

    const extraSpins = 4 + Math.floor(Math.random()*3);
    const totalDelta = extraSpins*360 + delta;
    const duration = 4200 + Math.random()*800;

    const startRot = currentRotation;
    const endRot = startRot + totalDelta;
    const startTime = performance.now();
    let lastTick = Math.floor(startRot/(360/N));
    let lastTickTime = 0;

    function frame(now){
      const t = Math.min((now - startTime)/duration, 1);
      const rot = startRot + (endRot - startRot)*easeOutCubic(t);
      canvas.style.transform = `rotate(${rot}deg)`;

      const tickIdx = Math.floor(rot/(360/N));
      if(tickIdx !== lastTick && now - lastTickTime > 25){
        playTick();
        lastTick = tickIdx;
        lastTickTime = now;
      }

      if(t < 1) requestAnimationFrame(frame);
      else{
        currentRotation = endRot;
        finishSpin(winnerIdx);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(idx){
    spinning = false;
    spinBtn.disabled = false;

    const seg = SEGMENTS[idx];
    document.getElementById('rEmoji').textContent = seg.emoji;
    document.getElementById('rTitle').textContent = seg.title;
    document.getElementById('rMsg').textContent = seg.msg;
    resultEl.classList.add('show');

    playFanfare();
    confetti(60);

    history.unshift(seg);
    if(history.length > 10) history.pop();
    historyEl.style.display = 'block';
    historyList.innerHTML = history.map(h => `<span class="chip">${h.emoji} ${h.label}</span>`).join('');

    if(navigator.vibrate) navigator.vibrate([30,50,100]);
  }

  spinBtn.addEventListener('click', spin);
  drawWheel();
</script>
</body>
</html>
