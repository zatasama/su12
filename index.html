<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Từ Hệ Thống</title>
    <!-- Nhúng font chữ đẹp từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset CSS cơ bản */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Nền tối mờ (giống màn hình chờ của web) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.85); /* Màu xanh đen tối */
            backdrop-filter: blur(8px); /* Làm mờ hậu cảnh */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Khung thông báo chính */
        .notification-card {
            position: relative;
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00d2ff, #00ff87);
            background-size: 300% 300%;
            animation: gradientBG 6s ease infinite;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(127, 0, 255, 0.4);
            text-align: center;
            max-width: 90%;
            width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        /* Hiệu ứng nền màu chuyển động */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Vòng tròn Loading (Đang tải) */
        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Chữ thông báo chính */
        .title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            animation: pulseText 2s infinite;
        }

        /* Hiệu ứng nhịp đập cho chữ */
        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 1); }
        }

        /* Chữ phụ bên dưới */
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- KHU VỰC BẢN QUYỀN CỦA MANH CODER LOR --- */
        .coder-credit {
            margin-top: 30px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            color: #fff;
            font-size: 14px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: floatCredit 3s ease-in-out infinite;
        }

        .coder-credit strong {
            color: #00ff87; /* Màu xanh neon */
            text-shadow: 0 0 10px #00ff87, 0 0 20px #00ff87;
            font-weight: 700;
        }

        /* Hiệu ứng lơ lửng cho badge */
        @keyframes floatCredit {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        /* ------------------------------------------- */

        /* Trang trí các bong bóng sáng (dùng CSS) */
        .notification-card::before,
        .notification-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            filter: blur(10px);
        }

        .notification-card::before {
            width: 100px;
            height: 100px;
            top: -30px;
            left: -30px;
        }

        .notification-card::after {
            width: 150px;
            height: 150px;
            bottom: -40px;
            right: -40px;
        }
        
        /* Tương thích trên điện thoại */
        @media (max-width: 600px) {
            .notification-card {
                padding: 30px 20px;
            }
            .title {
                font-size: 24px;
            }
            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Khung thông báo -->
    <div class="notification-card">
        <div class="spinner"></div>
        <div class="title">ĐANG CHỜ ĐÁP ÁN<br>TỪ CÔ</div>
        <div class="subtitle">Hệ thống đang cập nhật, vui lòng đợi trong giây lát...</div>
        
        <!-- Bản quyền Manh coder lor -->
        <div class="coder-credit">
            Coded by: <strong>Manh coder lor</strong> 😎
        </div>
    </div>

</body>
</html>
